<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Calendário — Gestor Acadêmico</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ versao }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif; }
  </style>
</head>
<body>
<div style="max-width:480px;margin:80px auto 0;padding:0 20px;text-align:center">
  <div style="font-size:36px;margin-bottom:12px">🔒</div>
  <div style="font-weight:700;font-size:18px;margin-bottom:8px">Página indisponível no momento</div>
  <div style="color:var(--text-muted);font-size:13.5px">
    O acompanhamento público deste calendário foi desativado pelo administrador.
    Fale com a equipe do Gestor Acadêmico se precisar do acesso.
  </div>
</div>
</body>
</html>
