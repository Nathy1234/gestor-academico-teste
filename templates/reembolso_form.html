{% extends 'base.html' %}
{% block title %}Novo Reembolso — INOVA{% endblock %}
{% block content %}
<div class="page">
  <div class="page-header">
    <div>
      <a href="{{ url_for('reembolsos') }}" style="color:var(--text-muted);text-decoration:none;font-size:13px">← Reembolsos</a>
      <div class="page-title" style="margin-top:6px">Novo Reembolso</div>
    </div>
  </div>
  <div class="card"><div class="card-body">
    <form method="POST">
      <div class="form-grid">
        <div class="form-group"><label>Colaborador</label><input type="text" name="colab" value="{{ item.colab if item else '' }}"></div>
        <div class="form-group"><label>Nome do Aluno</label><input type="text" name="nome_aluno" value="{{ item.nome_aluno if item else '' }}" required></div>
        <div class="form-group"><label>Nome do Curso</label><input type="text" name="nome_curso" value="{{ item.nome_curso if item else '' }}" required></div>
        <div class="form-group"><label>Categoria</label><input type="text" name="categoria" value="{{ item.categoria if item else '' }}" placeholder="RÁPIDO, PROFISSIONALIZANTE..."></div>
        <div class="form-group"><label>Data da Compra</label><input type="date" name="data_compra" value="{{ item.data_compra.strftime('%Y-%m-%d') if item and item.data_compra else '' }}"></div>
        <div class="form-group"><label>Data Solicitação</label><input type="date" name="data_solicitacao" value="{{ item.data_solicitacao.strftime('%Y-%m-%d') if item and item.data_solicitacao else '' }}"></div>
        <div class="form-group"><label>Valor (R$)</label><input type="number" step="0.01" name="valor" value="{{ item.valor if item else '' }}"></div>
        <div class="form-group"><label>Valor Estorno (R$)</label><input type="number" step="0.01" name="valor_estorno" value="{{ item.valor_estorno if item else '' }}"></div>
        <div class="form-group"><label>Data Aprovação</label><input type="date" name="data_aprovacao" value="{{ item.data_aprovacao.strftime('%Y-%m-%d') if item and item.data_aprovacao else '' }}"></div>
        <div class="form-group full"><label>Motivo</label><textarea name="motivo">{{ item.motivo if item else '' }}</textarea></div>
        <div class="form-group full"><label>Observações</label><textarea name="obs">{{ item.obs if item else '' }}</textarea></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px">
        <a href="{{ url_for('reembolsos') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">Salvar</button>
      </div>
    </form>
  </div></div>
</div>
{% endblock %}
