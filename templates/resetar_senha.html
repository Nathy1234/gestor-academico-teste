<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Gestor Acadêmico</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function() {
      const t = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">GA</div>
      <div>
        <div class="login-logo-text">Gestor Acadêmico</div>
        <small class="login-logo-sub">Criar nova senha</small>
      </div>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert alert-{{ cat }}" style="margin:0 0 16px">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" name="nova_senha" required minlength="8" autofocus>
        <div style="font-size:11px;color:var(--text-muted);margin-top:4px">Mínimo de 8 caracteres.</div>
      </div>
      <div class="form-group" style="margin-top:14px">
        <label>Confirmar nova senha</label>
        <input type="password" name="confirmar_senha" required minlength="8">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:20px;padding:11px">
        Salvar nova senha
      </button>
    </form>
  </div>
</div>
</body>
</html>
