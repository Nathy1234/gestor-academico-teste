[build]
  command = "pip install -r requirements.txt -t netlify/functions && cp app.py netlify/functions/ && cp -r templates netlify/functions/ && cp -r static netlify/functions/"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.11"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
